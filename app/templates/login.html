{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo large">🎫</div>
      <h1>TicketAI</h1>
      <p>AI Support Ticket Classifier</p>
    </div>

    {% if error %}
    <div class="alert error">{{ error }}</div>
    {% endif %}

    <form method="POST" class="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="admin / agent / demo" required autofocus />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn primary full">Sign in</button>
    </form>

    <div class="demo-accounts">
      <p class="muted small">Demo accounts</p>
      <div class="demo-list">
        <code>admin / admin123</code>
        <code>agent / agent123</code>
        <code>demo / demo123</code>
      </div>
    </div>
  </div>
</div>
{% endblock %}
